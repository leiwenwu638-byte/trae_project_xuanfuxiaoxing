[package]
name = "xuanfu-xiaoxing"
version = "0.1.0"
description = "悬浮小醒：轻量 Tauri 托盘常驻式学习工作节律助手。"
authors = ["xuanfu-xiaoxing"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xuanfu_xiaoxing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` 启用 Tauri 2 自带的系统托盘 API（tauri::tray / tauri::menu）。
# 不引入额外 plugin；托盘能力来自 Tauri 2 核心模块。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
